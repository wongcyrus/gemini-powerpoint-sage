files:
  ./:
    type: pattern
    actions: [read]
    params:
      patterns: ['*.cache', '*.png', '*.jpg', '*.jpeg', '*.mp3', slide_*.mp4, slide_*.webm, '*_visuals', '{base}*.json']
      caller: [_update_total_entries, clear_cache, _cleanup_cache_if_needed, get_cache_stats, _handle_video_synthesis, _handle_synthesize_style_videos]
  .cache:
    type: literal
    actions: [read]
    params:
      caller: [get_cached_prompt, _save_cache_entry, is_cache_valid]
      path: [self.cache_dir]
  args.audio_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  args.progress_file:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [pptx_dir, args.progress_file]
  args.slides_dir:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  audio_dir:
    type: literal
    actions: [read]
    params:
      caller: [Path(args.audio_dir), audio_dir.glob]
  base_dir:
    type: literal
    actions: [read]
    params:
      caller: [Path(output_dir), base_dir.glob]
  cache_file:
    type: variable
    actions: [read, delete]
    params:
      caller: [open, json.load, cache_file.unlink]
      alias: [f]
  cache_metadata.json:
    type: literal
    actions: [read]
    params:
      caller: [_initialize_cache, _load_metadata, _save_metadata]
      path: [self.cache_dir]
  config_path:
    type: literal
    actions: [read]
    params:
      caller: [Path(args.style_config)]
  current_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.path.dirname]
  en_img_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, Image.open]
  en_progress_file:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists]
  file_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.basename]
  filepath:
    type: variable
    actions: [write]
    params:
      caller: [open]
      alias: [f]
  img_path:
    type: variable
    actions: [read, write]
    params:
      caller: [os.path.exists, open, Image.open]
  input_folder:
    type: variable
    actions: [read]
    params:
      caller: [Path]
  input_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.abspath]
  json_file:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [self.input_path, json_file]
  main.py:
    type: pattern
    actions: [read]
    params:
      caller: [os.path.join]
      pattern: [project_root, veo_mcp, main.py]
  metadata_path:
    type: variable
    actions: [read, write]
    params:
      caller: [open, json.load]
      alias: [f]
  output_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs, Path]
  output_file_path:
    type: variable
    actions: [read]
    params:
      caller: [Path, open]
  output_path:
    type: literal
    actions: [read]
    params:
      caller: [Path(args.video_output)]
  pptx_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.basename, os.path.dirname]
  presentation_path:
    type: variable
    actions: [read]
    params:
      caller: [os.path.exists, open, json.load, Path]
  reduced_img_path:
    type: variable
    actions: [read, delete]
    params:
      caller: [Image.open, os.path.exists, os.unlink]
  segments_dir:
    type: variable
    actions: [read]
    params:
      caller: [segments_dir.glob]
  slides_dir:
    type: literal
    actions: [read]
    params:
      caller: [Path(args.slides_dir), slides_dir.glob]
  speech_dir:
    type: variable
    actions: [read]
    params:
      caller: [speech_dir.glob]
  target_img_path:
    type: variable
    actions: [read, write]
    params:
      caller: [os.path.exists, open]
  temp_file:
    type: variable
    actions: [write, delete]
    params:
      caller: [open, temp_file.unlink]
      alias: [f]
  temp_path:
    type: variable
    actions: [read, delete]
    params:
      caller: [os.path.exists, os.unlink]
  tmp_path:
    type: variable
    actions: [read]
    params:
      caller: [im.save]
  vdir:
    type: variable
    actions: [read]
    params:
      caller: [vdir.glob]
  video_prompt_file:
    type: variable
    actions: [write, read]
    params:
      caller: [open, json.load]
      alias: [f]
  videos_dir:
    type: variable
    actions: [read]
    params:
      caller: [os.makedirs]

processes:
  python:
    type: mcp
    actions: [exec]
    args: [[-m, mcp_sample.veo_server]]
    params:
      caller: [StdioServerParameters]
      shell: ["False"]
  uv:
    type: mcp
    actions: [exec]
    args: [[run]]
    params:
      caller: [StdioServerParameters]
      shell: ["False"]
